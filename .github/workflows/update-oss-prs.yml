name: Update external OSS merged PRs

on:
  schedule:
    # 00:17 UTC = 09:17 JST
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: '年度開始年。空欄なら日本時間の現在年度（例: 2026）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: external-oss-prs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Collect and verify merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          FISCAL_YEAR: ${{ inputs.fiscal_year }}
        run: |
          args=(--author noritaka1166 --output-dir generated)
          if [[ -n "$FISCAL_YEAR" ]]; then
            args+=(--fiscal-year "$FISCAL_YEAR")
          fi
          python scripts/collect_external_oss_prs.py "${args[@]}"
      - name: Save CSVs and audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-oss-prs
          path: generated/*
          if-no-files-found: error
          retention-days: 90

  commit:
    if: ${{ vars.OSS_PRS_COMMIT == 'true' }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: external-oss-prs
          path: generated
      - name: Commit changed CSV files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- generated/noritaka1166_external_oss_merged_prs_fy*.csv
          if git diff --cached --quiet; then
            echo "CSVに変更はありません"
            exit 0
          fi
          git commit -m "chore: update external OSS merged PR lists"
          git push origin "HEAD:$DEFAULT_BRANCH"
